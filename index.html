<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Returning visitors who chose English are sent from the Greek root to /en. Deep links are never redirected. -->
    <script>
      try {
        if (location.pathname === '/' && localStorage.getItem('fdas-locale') === 'en') {
          location.replace('/en' + location.search + location.hash)
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-32.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#AF4245" />
    <!-- Title, description, canonical, hreflang, Open Graph and JSON-LD are set per route in src/App.vue. -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
